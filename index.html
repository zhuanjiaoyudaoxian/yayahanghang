.select .mini-date,.select .mini-time{position:relative;text-shadow:0 1px 7px #0007;z-index:1}
.select .mini-time{font-size:clamp(25px,7vw,45px)}
.select .mini-date{font-size:clamp(9px,2.5vw,12px)}
.select .mini-apps{display:none}
.select .choice:disabled .mini-phone{filter:none;opacity:1}
.select .mini-lock{background:#c4c0cb8e;backdrop-filter:grayscale(.75);border-radius:inherit}
.select .mini-lock svg{width:37px;height:37px;filter:drop-shadow(0 2px 2px #4447)}
.select .choice-sub{border-radius:50px;padding:11px 13px;font-size:clamp(12px,3.6vw,17px);font-weight:700;min-height:43px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.select .active-choice{background:linear-gradient(#fff6fa,#f8bad2);color:#966078;box-shadow:inset 0 2px 0 #fff,0 4px 0 #e9aac2,0 8px 12px #e2a7bc45;border:1px solid #eba6c6}
.select .locked-choice{background:linear-gradient(#f9f8f9,#dfd9df);color:#a39ca4;box-shadow:inset 0 2px 0 #fff,0 3px 0 #bdb6c0;border:1px solid #c5bec8}
.select #pick-gao:not(:disabled) .locked-choice{background:#f9d5e4;color:#9b607a;border-color:#e6a6c1}
.scrap-footer{position:relative;z-index:2;margin-top:clamp(24px,5vh,42px);font-size:clamp(9px,2.2vw,12px);color:#bda5b4;letter-spacing:1.2px;background:#fffafaaf;padding:10px 14px;border:1px dashed #edd2dd;border-radius:9px;text-align:center}
.scrap-footer span{color:#d88db0;font-size:14px}
.scrap-deco{position:absolute;pointer-events:none;color:#e9a0ba;font-weight:800;z-index:1;text-shadow:0 2px #fff}
.deco-star1{top:14%;left:7%;font-size:35px;color:#edc67f}.deco-star2{top:22%;right:9%;font-size:24px;color:#e3c37a}.deco-heart1{top:29%;left:8%;font-size:27px;transform:rotate(-18deg)}.deco-heart2{right:6%;bottom:23%;font-size:32px;transform:rotate(16deg)}.deco-bow{right:4%;top:33%;font-size:40px;color:#e59dbf;transform:rotate(16deg)}
.sticker{position:absolute;pointer-events:none;z-index:3;object-fit:contain;filter:drop-shadow(0 4px 5px #99778733)}
.sticker-hachi{bottom:2%;left:-3%;width:clamp(92px,24%,150px);transform:rotate(-8deg)}
.sticker-otter{right:-5%;bottom:2%;width:clamp(110px,28%,174px);transform:rotate(5deg)}
.sticker-hachi-top{right:13%;top:29%;width:clamp(55px,16%,95px)}
@media (max-width:520px){.app:has(.select:not(.hidden)){background:#faf3f7}.select{padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(35px,env(safe-area-inset-bottom))}.select .choices{max-width:410px}.sticker-hachi{bottom:4%}.sticker-otter{bottom:4%}.scrap-footer{margin-bottom:13px}}
@media (max-height:690px){.select{padding:15px 14px}.scrap-heading{margin-bottom:12px}.select h1{font-size:23px;margin:4px 0 7px}.scrap-paper{padding:7px}.select .choices{max-width:390px}.select .choice{gap:9px}.select .mini-phone{max-height:44vh;width:auto;aspect-ratio:.54}.scrap-footer{margin-top:14px}.sticker-hachi,.sticker-otter{width:90px}}
/* iPhone Safari: render images as real elements, not oversized CSS data URLs */
.select .mini-screen{position:relative;isolation:isolate;background:#c8b4dd}
.select .mini-screen.b{background:#bcb7c6}
.select .preview-wallpaper{display:block;position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.select .mini-screen:before{z-index:1}
.select .mini-date,.select .mini-time,.select .mini-island,.select .mini-lock{z-index:2}
.select .mini-lock{z-index:3}
.select .sticker{font-size:0}

const STORE='shiguang-phones-v1', EVIDENCE_STORE='anlian-evidence-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(STORE))||{}}catch{};
const persist=()=>{try{localStorage.setItem(STORE,JSON.stringify(saved))}catch{}};
let evidence=[];try{const raw=JSON.parse(localStorage.getItem(EVIDENCE_STORE));if(Array.isArray(raw))evidence=raw.filter(x=>['wechat','browser','music','notes','voice'].includes(x)).filter((x,i,a)=>a.indexOf(x)===i)}catch{}
const evidenceComplete=()=>evidence.length===5;
const evidenceLabels={wechat:'微信',browser:'Safari',music:'网易云音乐',notes:'备忘录',voice:'语音备忘录'};
const demoEvidence=id=>owner==='shen'?`<button type="button" class="demo-evidence" data-evidence="${id}" ${evidence.includes(id)?'disabled':''}>${evidence.includes(id)?'✓ 已发现证据 · '+evidence.length+'/5':'◇ 发现测试证据'}</button>`:'';
let bannerTimer;
function updateEvidenceUI(){const c=$('#evidence-count'),b=$('#evidence-status');if(c)c.textContent=evidence.length+'/5';if(b)b.classList.toggle('hidden',owner!=='shen'||!unlocked);}
function collectEvidence(id){if(owner!=='shen'||!Object.hasOwn(evidenceLabels,id)||evidence.includes(id))return;evidence.push(id);try{localStorage.setItem(EVIDENCE_STORE,JSON.stringify(evidence))}catch{};updateEvidenceUI();updatePicker();const banner=$('#evidence-banner');$('#evidence-banner-title').textContent=evidenceComplete()?'暗恋证据已集齐':'发现暗恋证据';$('#evidence-banner-sub').textContent=evidenceComplete()?'5/5 · 高铭阳的手机已解锁':evidence.length+'/5';banner.classList.remove('hidden');clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>banner.classList.add('hidden'),evidenceComplete()?3900:2600);if(evidenceComplete()){$('#sheet-title').textContent='暗恋证据已集齐';$('#sheet-message').textContent='5/5 · 高铭阳的手机已解锁。返回手机选择页即可进入。';setTimeout(()=>{if(owner==='shen'&&unlocked)$sheet.classList.remove('hidden')},800)}else if(app)renderApp();}

const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const apps=[['wechat','微信'],['browser','Safari'],['music','网易云音乐'],['notes','备忘录'],['voice','语音备忘录'],['photos','照片'],['settings','设置']];
const appIcon=(id,name)=>`<button class="app-icon" data-app="${id}"><span class="glyph ${id}">${icon(({wechat:'chat',browser:'compass',music:'music',notes:'notes',voice:'voice',photos:'photo',settings:'gear',phone:'phone'})[id])}</span><span>${name}</span></button>`;
const renderGrid=()=>{$('#grid').innerHTML=apps.map(a=>appIcon(...a)).join('');$('#dock').innerHTML=appIcon('phone','电话')+appIcon('wechat','微信')+appIcon('browser','Safari')+appIcon('music','网易云音乐');};
const date=new Date();const displayTime=()=>{let now=new Date(),h=now.getHours(),m=String(now.getMinutes()).padStart(2,'0');return `${h}:${m}`};const dateText=()=>{const d=new Date();return `${d.getMonth()+1}月${d.getDate()}日 星期${'日一二三四五六'[d.getDay()]}`};
const setClock=()=>{const t=displayTime(),d=dateText();$('#status-time').textContent=t;$('#lock-time').textContent=t;$('#desk-time').textContent=t;$('#lock-date').textContent=d;$('#desk-date').textContent=d};setClock();setInterval(setClock,30000);
function showToast(text){const t=$('#toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2400)}
function showChooser(){closeApp();$('#evidence-banner').classList.add('hidden');$('#evidence-status').classList.add('hidden');typed='';drawDots();$passcode.classList.add('hidden');$desktop.classList.add('hidden');$lock.classList.remove('hidden');unlocked=false;$device.classList.add('hidden');$choose.classList.remove('hidden');$sheet.classList.add('hidden')}
function updatePicker(){let yes=evidenceComplete();$('#pick-gao').disabled=!yes;$('#gao-caption').textContent=yes?'♡ 点击探索':'♧ 尚未解锁';const lock=$('#pick-gao .mini-lock');if(lock)lock.classList.toggle('hidden',yes)}
function enterPhone(which){owner=which;$choose.classList.add('hidden');$device.classList.remove('hidden');$('#wallpaper').style.background=which==='shen'?'radial-gradient(ellipse at 80% 90%,#ffdbd8 0%,transparent 44%),radial-gradient(ellipse at 5% 40%,#b4d0ff 0%,transparent 52%),linear-gradient(155deg,#7f7bd3,#e5c0d0 55%,#d5e9ff)':'radial-gradient(ellipse at 15% 80%,#bca3df,transparent 50%),linear-gradient(145deg,#565e85,#99aec6 65%,#d0c2df)';$lock.classList.remove('hidden');$passcode.classList.add('hidden');$desktop.classList.add('hidden');closeApp();unlocked=false;typed='';$('#homebar').classList.add('light');updateEvidenceUI()}
function openPass(){if(unlocked)return;$lock.classList.add('hidden');$passcode.classList.remove('hidden');typed='';drawDots()}
function drawDots(){const el=$('#dots');if(el.children.length!==6)el.innerHTML='<span></span>'.repeat(6);Array.from(el.children).forEach((dot,i)=>dot.classList.toggle('on',i<typed.length))}
function passDigit(k){if(errorTimer){clearTimeout(errorTimer);errorTimer=null}if(k==='del'){typed=typed.slice(0,-1)}else if(typed.length<6){typed+=k}drawDots();$('#pass-error').textContent='';if(typed.length===6){if(typed==='131121'){unlocked=true;$passcode.classList.add('hidden');$desktop.classList.remove('hidden');$('#homebar').classList.remove('light');renderGrid();updateEvidenceUI()}else{$('#pass-error').textContent='密码错误，请重试';errorTimer=setTimeout(()=>{typed='';drawDots();errorTimer=null},530)}}}
$('#keypad').innerHTML=['1','2','3','4','5','6','7','8','9','', '0','del'].map(k=>k?`<button class="key ${k==='del'?'small':''}" data-digit="${k}">${k==='del'?'删除':k}</button>`:'<span class="key empty"></span>').join('');
$('#keypad').onclick=e=>{const b=e.target.closest('[data-digit]');if(b)passDigit(b.dataset.digit)};
$('#pick-shen').onclick=()=>enterPhone('shen');$('#pick-gao').onclick=()=>{if(evidenceComplete())enterPhone('gao')};$('#unlock').onclick=openPass;$('#lock').addEventListener('touchstart',e=>{window._startY=e.touches[0].clientY},{passive:true});$('#lock').addEventListener('touchend',e=>{if(window._startY-e.changedTouches[0].clientY>40)openPass()},{passive:true});$('#cancel-pass').onclick=()=>{$passcode.classList.add('hidden');$lock.classList.remove('hidden')};
$('#homebar').onclick=()=>{if(!$sheet.classList.contains('hidden')){$sheet.classList.add('hidden');return}if(!unlocked){if(!$passcode.classList.contains('hidden')){$passcode.classList.add('hidden');$lock.classList.remove('hidden')}else openPass();return}closeApp()};
function closeApp(){app='';$layer.innerHTML='';$('#homebar').classList.toggle('light',!unlocked)}
$device.addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(b)openApp(b.dataset.app)});
function shell(cls,title,body,footer='',tools=''){return `<section class="os-app ${cls}"><header class="app-head"><button class="back" data-action="home">${icon('left')}<span>返回</span></button><strong>${title}</strong><button class="head-tool" data-action="${tools||'nothing'}">${tools==='new-note'?icon('pencil'):tools==='options'?icon('plus'):''}</button></header>${body}${footer}</section>`}
function empty(title,sub,ico='folder'){return `<div class="empty-state">${icon(ico)}<strong>${title}</strong><small>${sub}</small></div>`}
const nav=(entries,active)=>`<nav class="tabbar">${entries.map(([id,label,ico])=>`<button class="${active===id?'active':''}" data-tab="${id}">${icon(ico)}<span>${label}</span></button>`).join('')}</nav>`;
function openApp(id,newtab){app=id;tab=newtab||({wechat:'聊天',music:'发现',browser:'首页',notes:'列表',voice:'录音',photos:'照片',settings:'设置',phone:'最近'}[id]);renderApp()}
function renderApp(){let html='';$('#homebar').classList.remove('light');if(app==='wechat'){
 const items=[['聊天','chat'],['通讯录','users'],['发现','discover'],['我','person']];
 const inner=tab==='聊天'?`<div class="search">${icon('search')}搜索</div><div class="scroll">${empty('暂无聊天记录','故事内容尚未添加','chat')}${demoEvidence('wechat')}</div>`:tab==='通讯录'?`<div class="scroll"><div class="wxline">${icon('users')}<span>新的朋友</span></div><div class="wxline">${icon('users')}<span>群聊</span></div><div class="wxline">${icon('users')}<span>标签</span></div>${empty('暂无联系人','将在剧情制作阶段添加','person')}</div>`:tab==='发现'?`<div class="scroll"><div class="wxline">${icon('photo')}<span>朋友圈</span></div><div class="wxline">${icon('search')}<span>搜一搜</span></div><div class="wxline">${icon('compass')}<span>小程序</span></div></div>`:`<div class="scroll"><div class="wxline">${icon('person')}<span>${owner==='shen'?'沈子航':'高铭阳'}</span></div><div class="wxline">${icon('folder')}<span>收藏</span></div><div class="wxline">${icon('gear')}<span>设置</span></div></div>`;
 html=shell('wx',tab,inner,nav(items,tab),'options');
 }else if(app==='browser'){
 html=`<section class="os-app safari"><div class="scroll"><div class="safari-body"><h2>Safari 浏览器</h2><p>输入网址或搜索关键词</p></div>${demoEvidence('browser')}</div><div class="addressbar">${icon('search')}<input id="web-address" placeholder="搜索或输入网站名称" autocomplete="off"/></div><nav class="safari-footer"><button data-action="webback">${icon('left')}</button><button data-action="webnext">${icon('right')}</button><button data-action="bookmark">${icon('book')}</button><button data-action="tabs">${icon('tab')}</button></nav></section>`;
 }else if(app==='music'){
 const musicTabs=[['发现','discover'],['播客','voice'],['我的','music'],['关注','users']];
 html=`<section class="os-app musicapp"><div class="music-top"><strong>${tab}</strong></div><div class="scroll"><div class="music-card">${icon('music')}<strong>网易云音乐</strong><span style="font-size:12px">音乐内容尚未添加</span></div><div class="music-list"><h3>${tab==='我的'?'我的音乐':'推荐音乐'}</h3><p>这里将用于展示歌单、歌曲和音乐内容。</p></div>${demoEvidence('music')}</div>${nav(musicTabs,tab).replace('class="active"','class="active"')}</section>`;
 }else if(app==='notes'){
 const all=getNotes();if(tab==='编辑'){const n=all.find(x=>x.id===noteId);html=shell('notesapp','备忘录',`<div class="scroll"><textarea class="note-edit" id="note-text" placeholder="开始输入…">${escapeHTML(n?.text||'')}</textarea></div>`,`<div class="notes-bottom"><button data-action="note-list">${icon('left')} 返回列表</button><button data-action="save-note">完成</button></div>`)}else{html=shell('notesapp','文件夹',`<div class="scroll"><div class="ios-title">备忘录</div>${demoEvidence('notes')}<div class="search">${icon('search')}搜索</div><div class="noteslist">${all.length?all.map(n=>`<div class="notesline" data-note="${n.id}"><strong>${escapeHTML(n.text.trim().split('\n')[0]||'新备忘录')}</strong><small>${n.date}</small></div>`).join(''):`<div class="empty-state" style="padding:42px 5px">${icon('notes')}<small>暂无备忘录</small></div>`}</div></div>`,`<div class="notes-bottom"><span>${all.length}条备忘录</span><button data-action="new-note">${icon('pencil')}</button></div>`)}
 }else if(app==='voice'){
 const items=JSON.parse(sessionStorage.getItem('shiguang-recordings')||'[]');html=`<section class="os-app voiceapp"><div class="voice-title">语音备忘录</div>${demoEvidence('voice')}<div class="record-list" id="record-list">${items.length?items.map((n,i)=>`<div class="record-item"><div class="detail"><strong>${escapeHTML(n.name)}</strong><small>${escapeHTML(n.duration)}</small></div><button data-action="play-record" data-index="${i}">${icon('right')}</button></div>`).join(''):empty('暂无录音','录音会显示在这里','voice')}</div><div class="record-control"><button class="record-btn ${isRecording?'on':''}" data-action="record" aria-label="开始或停止录音"></button></div></section>`;
 }else if(app==='photos'){
 html=shell('','照片',`<div class="scroll"><div class="ios-title">图库</div>${empty('暂无照片','剧情照片将在这里展示','photo')}</div>`,nav([['照片','photo'],['相簿','folder'],['搜索','search']],tab));
 }else if(app==='settings'){
 html=shell('','设置',`<div class="scroll"><div class="ios-title">设置</div><div class="noteslist"><div class="notesline"><strong>设备名称</strong><small>${owner==='shen'?'沈子航':'高铭阳'}的 iPhone</small></div><div class="notesline"><strong>关于本机</strong><small>故事演示设备</small></div></div><div class="noteslist"><div class="notesline" data-action="show-menu"><strong>暗恋证据</strong>${icon('right')}</div><div class="notesline" data-action="switch"><strong>返回手机选择</strong>${icon('right')}</div></div></div>`);
 }else if(app==='phone'){
 html=shell('','电话',`<div class="scroll"><div class="ios-title">最近通话</div>${empty('暂无通话记录','剧情内容尚未添加','phone')}</div>`,nav([['个人收藏','heart'],['最近','voice'],['通讯录','users'],['拨号键盘','phone']],tab));
 }
 $layer.innerHTML=html;const inp=$('#web-address');if(inp){inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(inp.value.trim())showToast('浏览器目前是界面演示，暂不加载网页');inp.blur()}})}
 const edit=$('#note-text');if(edit)edit.focus();
 }
function getNotes(){return saved['notes_'+owner]||[]}
function saveNote(){const t=$('#note-text');if(!t)return;let notes=getNotes();const n=notes.find(x=>x.id===noteId);if(n)n.text=t.value;else notes.unshift({id:noteId,text:t.value,date:new Date().toLocaleDateString('zh-CN')});saved['notes_'+owner]=notes;persist();tab='列表';renderApp()}
function newNote(){noteId=Date.now();const n=getNotes();n.unshift({id:noteId,text:'',date:new Date().toLocaleDateString('zh-CN')});saved['notes_'+owner]=n;persist();tab='编辑';renderApp()}
$layer.addEventListener('click',async e=>{const ev=e.target.closest('[data-evidence]');if(ev){collectEvidence(ev.dataset.evidence);return}const tabBtn=e.target.closest('[data-tab]');if(tabBtn){tab=tabBtn.dataset.tab;renderApp();return}const note=e.target.closest('[data-note]');if(note){noteId=Number(note.dataset.note);tab='编辑';renderApp();return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='home'){if(app==='notes'&&tab==='编辑')saveNote();else closeApp()}else if(action==='new-note')newNote();else if(action==='save-note'||action==='note-list')saveNote();else if(action==='show-menu'){ $('#sheet-title').textContent='暗恋证据';$('#sheet-message').textContent='已收集 '+evidence.length+'/5。故事内容尚未添加，目前可在五个应用中点击测试证据体验收集流程。';$sheet.classList.remove('hidden');}else if(action==='switch')showChooser();else if(action==='record')await recordToggle();else if(action==='play-record')showToast('录音演示：音频仅在当前会话内保存');else if(action==='options')showToast('暂未添加故事数据');else if(['webback','webnext','bookmark','tabs'].includes(action))showToast('浏览器功能将在后续完善');});
async function recordToggle(){if(isRecording){if(recorder&&recorder.state!=='inactive')recorder.stop();isRecording=false;renderApp();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){showToast('当前浏览器不支持麦克风录音');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});audioParts=[];recorder=new MediaRecorder(stream);const started=Date.now();recorder.ondataavailable=e=>audioParts.push(e.data);recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());let list=JSON.parse(sessionStorage.getItem('shiguang-recordings')||'[]');list.unshift({name:'新录音 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),duration:Math.floor((Date.now()-started)/1000)+'秒'});sessionStorage.setItem('shiguang-recordings',JSON.stringify(list));if(app==='voice')renderApp()};recorder.start();isRecording=true;renderApp()}catch{showToast('没有获得麦克风权限')}}
$('#close-sheet').onclick=()=>$sheet.classList.add('hidden');$('#switch-phone').onclick=showChooser;$('#return-picker').onclick=showChooser;updatePicker();updateEvidenceUI();
// Long press on desktop opens the evidence progress sheet.
let holdTimer;$('#desktop').addEventListener('touchstart',e=>{if(e.target.closest('[data-app]'))return;holdTimer=setTimeout(()=>$sheet.classList.remove('hidden'),850)},{passive:true});$('#desktop').addEventListener('touchend',()=>clearTimeout(holdTimer));$('#desktop').addEventListener('contextmenu',e=>{if(!e.target.closest('[data-app]')){e.preventDefault();$sheet.classList.remove('hidden')}});
})();
</script>
</body>
</html>
